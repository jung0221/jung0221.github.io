name: Deploy site

# Builds the site with Jekyll and pushes the result to the `gh-pages` branch.
#
# This indirection is necessary: the site uses jekyll-scholar (and the al_folio_*
# plugins) to render publications from _bibliography/papers.bib, and GitHub Pages'
# own native build only allows a fixed allow-list of plugins that does not include
# them. So we build here and publish the finished _site/.
#
# Repository Settings that must match this file:
#   Settings > Pages > Build and deployment > Source = "Deploy from a branch"
#                                             Branch = gh-pages,  folder = / (root)
#   Settings > Actions > General > Workflow permissions = "Read and write permissions"
#
# The gh-pages branch is created by the first successful run — it will not exist
# before then, so set the Pages source after the first green run.

on:
  push:
    branches:
      - main
    paths:
      - "assets/**"
      - "_bibliography/**"
      - "_data/**"
      - "_news/**"
      - "_pages/**"
      - "_posts/**"
      - "**.bib"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "Gemfile"
      - "Gemfile.lock"
      - "!HOWTO.md"
  pull_request:
    branches:
      - main
  workflow_dispatch: # lets you trigger a rebuild by hand from the Actions tab

permissions:
  contents: write # needed to push the built site to gh-pages

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Ruby 💎
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true # bundle install + cache gems between runs

      - name: Setup Python 🐍
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install and Build 🔧
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          pip3 install --upgrade nbconvert
          export JEKYLL_ENV=production
          bundle exec jekyll build

      - name: Deploy 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
          branch: gh-pages
