        highlights:
          - Desenvolvimento de métodos de reconstrução 3D para Tomografia por Impedância Elétrica usando representações neurais implícitas, modelos de difusão, fluxos normalizadores, KANs e transformers.
          - Construção de todo o pipeline de pesquisa - segmentação de tomografias, geração de malhas 3D por elementos finitos, simulação do problema direto e solucionador inverso neural.

