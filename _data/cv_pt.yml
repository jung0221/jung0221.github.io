# Versão em português de _data/cv.yml, renderizada em /pt/cv/.
#
# As CHAVES das seções (Education, Experience, Projects, Awards, Skills,
# Interests) permanecem em inglês de propósito: o renderizador despacha por elas
# para escolher o template de cada seção. Os títulos exibidos são traduzidos em
# _data/i18n.yml. Renomear uma chave aqui não quebra o build — apenas joga a
# seção no ramo genérico, que a renderiza errado silenciosamente.
#
# Ao editar este arquivo, edite _data/cv.yml também. Uma das duas versões
# desatualizada é pior do que nenhuma tradução.
#
# NOTA: as publicações não estão aqui de propósito. Elas vivem em
# _bibliography/papers.bib e são renderizadas na página de publicações.
#
# Um end_date vazio é renderizado como "Present".
